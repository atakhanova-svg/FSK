<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ФСК — Подбор жилья</title>
<style>
  :root{
    --bg: #FFFFFF;
    --bg-card: #FAFAFA;
    --accent: #FF6A1A;
    --text: #16161A;
    --text-muted: #767678;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header{
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .hero{
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 32px;
    text-align: center;
  }
  .hero .eyebrow{
    display: inline-block;
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .hero h1{
    font-size: 34px;
    line-height: 1.25;
    margin: 0 0 16px;
  }
  .hero h1 em{
    font-style: normal;
    color: var(--accent);
  }
  .hero p{
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 auto 8px;
    max-width: 520px;
  }
  .quiz-wrap{
    max-width: 640px;
    margin: 24px auto 64px;
    padding: 0 16px;
  }
  .quiz-card{
    background: var(--bg-card);
    border-radius: 20px;
    padding: 4px;
    min-height: 120px;
  }
  .quiz-placeholder{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
    padding: 24px;
  }
  footer{
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 12px;
    border-top: 1px solid rgba(0,0,0,0.08);
  }
  @media (max-width: 480px){
    .hero h1{ font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <div style="color:var(--text-muted); font-size:13px;">Демо-страница опроса</div>
</header>

<section class="hero">
  <span class="eyebrow">Подбор жилья</span>
  <h1>Помогите нам сделать выбор квартиры <em>ещё удобнее</em></h1>
  <p>Пройдите короткий опрос о вашем опыте — это займёт пару минут и поможет нам стать лучше.</p>
</section>

<div class="quiz-wrap">
  <div class="quiz-card">
    <div class="quiz-placeholder" id="quiz-placeholder">Опрос загружается…</div>
    <div data-popmechanic-embed="167924"></div>
  </div>
</div>

<footer>
  Тестовая демонстрационная страница. Не является страницей fsk.ru.
</footer>

<script>
  window.mindbox = window.mindbox || function(){ mindbox.queue.push(arguments) };
  mindbox.queue = mindbox.queue || [];
  mindbox("create", { endpointId: "fsk.Website" });
</script>
<script src="https://api.mindbox.ru/scripts/v1/tracker.js" async></script>
<script src="https://web-static.mindbox.ru/js/byendpoint/fsk.website.js" async></script>

<script>
  // прячем плейсхолдер, как только виджет реально отрисовался
  var ph = document.getElementById('quiz-placeholder');
  var tries = 0;
  var iv = setInterval(function(){
    tries++;
    var box = document.querySelector('[data-popmechanic-embed] iframe, [data-popmechanic-embed] .popmechanic-is-container *');
    if (document.querySelector('[data-popmechanic-embed]').children.length > 0) {
      ph.style.display = 'none';
      clearInterval(iv);
    }
    if (tries > 40) { clearInterval(iv); } // ~20 сек, дальше плейсхолдер просто останется
  }, 500);
</script>

</body>
</html>
